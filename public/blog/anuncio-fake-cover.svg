<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#22c9c9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- price tag -->
  <g transform="translate(230,90)">
    <path d="M0 40 L140 0 L280 40 L280 260 Q280 280 260 280 L20 280 Q0 280 0 260 Z" fill="#0c0e12" stroke="url(#g1)" stroke-width="2.5"/>
    <circle cx="140" cy="55" r="10" fill="none" stroke="#22c9c9" stroke-width="2.5"/>

    <text x="140" y="140" text-anchor="middle" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="22" text-decoration="line-through">R$999</text>
    <text x="140" y="200" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="46" font-weight="700">R$99</text>
    <text x="140" y="240" text-anchor="middle" fill="#22c9c9" font-family="Arial, sans-serif" font-size="20" font-weight="700">90% OFF</text>
  </g>

  <!-- magnifier -->
  <g transform="translate(520,180)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#g1)" stroke-width="6"/>
    <line x1="40" y1="40" x2="90" y2="90" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="10" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="34" font-weight="700">?</text>
  </g>

  <text x="400" y="400" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Nem todo desconto gigante é real</text>
</svg>
