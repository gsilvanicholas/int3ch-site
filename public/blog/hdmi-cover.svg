<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#22c9c9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <g transform="translate(120,180)">
    <path d="M0 0 h70 l14 20 l-14 20 h-70 z" fill="none" stroke="#2f7fe0" stroke-width="3"/>
    <text x="42" y="-15" text-anchor="middle" fill="#aab2c0" font-family="Arial, sans-serif" font-size="16" font-weight="700">HDMI 2.0</text>
    <text x="42" y="60" text-anchor="middle" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="14">4K 60Hz</text>
  </g>

  <line x1="260" y1="200" x2="480" y2="200" stroke="#21252e" stroke-width="3" stroke-dasharray="6 6"/>
  <polygon points="480,192 500,200 480,208" fill="#22c9c9"/>

  <g transform="translate(540,180)">
    <path d="M0 0 h90 l18 20 l-18 20 h-90 z" fill="none" stroke="url(#g1)" stroke-width="4"/>
    <text x="45" y="-15" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="16" font-weight="700">HDMI 2.1</text>
    <text x="45" y="60" text-anchor="middle" fill="#22c9c9" font-family="Arial, sans-serif" font-size="14" font-weight="700">4K 120Hz+</text>
  </g>

  <text x="400" y="370" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="20" font-weight="700">So importa se sua tela e sua GPU aproveitam</text>
</svg>
