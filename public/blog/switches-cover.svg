<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#22c9c9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <g transform="translate(150,140)">
    <rect x="0" y="60" width="90" height="90" rx="10" fill="#0c0e12" stroke="#2f7fe0" stroke-width="2.5"/>
    <rect x="30" y="0" width="30" height="70" rx="4" fill="#2f7fe0" opacity="0.7"/>
    <text x="45" y="180" text-anchor="middle" fill="#aab2c0" font-family="Arial, sans-serif" font-size="16" font-weight="700">LINEAR</text>
  </g>

  <g transform="translate(360,140)">
    <rect x="0" y="60" width="90" height="90" rx="10" fill="#0c0e12" stroke="#22c9c9" stroke-width="2.5"/>
    <rect x="30" y="0" width="30" height="70" rx="4" fill="#22c9c9" opacity="0.7"/>
    <path d="M 30 35 h 30" stroke="#0c0e12" stroke-width="4"/>
    <text x="45" y="180" text-anchor="middle" fill="#aab2c0" font-family="Arial, sans-serif" font-size="16" font-weight="700">TATIL</text>
  </g>

  <g transform="translate(570,140)">
    <rect x="0" y="60" width="90" height="90" rx="10" fill="#0c0e12" stroke="url(#g1)" stroke-width="3"/>
    <rect x="30" y="0" width="30" height="70" rx="4" fill="url(#g1)"/>
    <circle cx="45" cy="20" r="14" fill="none" stroke="#f2f4f8" stroke-width="2"/>
    <text x="45" y="180" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="16" font-weight="700">CLICKY</text>
  </g>

  <text x="400" y="380" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Cada switch muda como o teclado responde</text>
</svg>
