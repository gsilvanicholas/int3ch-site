<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#22c9c9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="therm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22c9c9"/>
      <stop offset="0.6" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#ff5a5a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <g transform="translate(340,90)">
    <rect x="20" y="0" width="20" height="220" rx="10" fill="#0c0e12" stroke="#21252e" stroke-width="2"/>
    <rect x="24" y="80" width="12" height="136" rx="6" fill="url(#therm)"/>
    <circle cx="30" cy="240" r="32" fill="#0c0e12" stroke="url(#g1)" stroke-width="3"/>
    <circle cx="30" cy="240" r="16" fill="#ff5a5a"/>
  </g>

  <text x="500" y="150" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="16">90°C+</text>
  <text x="500" y="150" fill="#ff5a5a" font-family="Arial, sans-serif" font-size="16" font-weight="700" dx="0"></text>
  <text x="500" y="200" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="16">60-80°C</text>
  <text x="500" y="250" fill="#22c9c9" font-family="Arial, sans-serif" font-size="16">idle / leve</text>

  <text x="400" y="380" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Nem toda queda de FPS e falta de poder</text>
</svg>
