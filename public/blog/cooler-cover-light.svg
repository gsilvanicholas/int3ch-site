<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d5fc7"/>
      <stop offset="1" stop-color="#0c8a82"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edeff3"/>
      <stop offset="1" stop-color="#f6f7f9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- air cooler -->
  <g transform="translate(190,110)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#g1)" stroke-width="3"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1d5fc7" stroke-width="2"/>
    <g stroke="#1d5fc7" stroke-width="2.5">
      <line x1="0" y1="-45" x2="0" y2="-70"/>
      <line x1="39" y1="-22" x2="61" y2="-35"/>
      <line x1="39" y1="22" x2="61" y2="35"/>
      <line x1="0" y1="45" x2="0" y2="70"/>
      <line x1="-39" y1="22" x2="-61" y2="35"/>
      <line x1="-39" y1="-22" x2="-61" y2="-35"/>
    </g>
    <rect x="-45" y="90" width="90" height="130" rx="4" fill="none" stroke="#e1e5eb" stroke-width="2"/>
    <text x="0" y="260" text-anchor="middle" fill="#5b6472" font-family="Arial, sans-serif" font-size="18" font-weight="700">AIR COOLER</text>
  </g>

  <text x="400" y="230" text-anchor="middle" fill="#5b6472" font-family="Arial, sans-serif" font-size="24" font-weight="700">vs</text>

  <!-- water cooler -->
  <g transform="translate(610,110)">
    <rect x="-90" y="-70" width="180" height="50" rx="8" fill="#f6f7f9" stroke="url(#g1)" stroke-width="2.5"/>
    <g stroke="#0c8a82" stroke-width="2">
      <line x1="-70" y1="-70" x2="-70" y2="-20"/>
      <line x1="-40" y1="-70" x2="-40" y2="-20"/>
      <line x1="-10" y1="-70" x2="-10" y2="-20"/>
      <line x1="20" y1="-70" x2="20" y2="-20"/>
      <line x1="50" y1="-70" x2="50" y2="-20"/>
    </g>
    <path d="M -80 -20 Q -80 40 -30 40 L -30 90" fill="none" stroke="#1d5fc7" stroke-width="4"/>
    <path d="M 80 -20 Q 80 40 30 40 L 30 90" fill="none" stroke="#0c8a82" stroke-width="4"/>
    <circle cx="0" cy="110" r="35" fill="none" stroke="url(#g1)" stroke-width="3"/>
    <text x="0" y="260" text-anchor="middle" fill="#5b6472" font-family="Arial, sans-serif" font-size="18" font-weight="700">WATER COOLER</text>
  </g>
