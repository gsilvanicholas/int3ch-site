    <rect x="0" y="14" width="280" height="24" rx="12" fill="#f6f7f9" stroke="#e1e5eb" stroke-width="2"/>
    <rect x="4" y="18" width="40" height="16" rx="8" fill="url(#g1)"/>
    <text x="0" y="70" fill="#5b6472" font-family="Arial, sans-serif" font-size="14">uso real diario</text>
