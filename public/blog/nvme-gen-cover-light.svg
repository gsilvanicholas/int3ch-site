<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d5fc7"/>
      <stop offset="1" stop-color="#0c8a82"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edeff3"/>
      <stop offset="1" stop-color="#f6f7f9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <text x="80" y="100" fill="#14181f" font-family="Arial, sans-serif" font-size="22" font-weight="700">Velocidade sequencial</text>

  <text x="80" y="180" fill="#5b6472" font-family="Arial, sans-serif" font-size="16">Gen3</text>
  <rect x="80" y="195" width="330" height="30" rx="6" fill="#1d5fc7" opacity="0.6"/>
  <text x="420" y="216" fill="#5b6472" font-family="Arial, sans-serif" font-size="15">~3500 MB/s</text>

  <text x="80" y="270" fill="#5b6472" font-family="Arial, sans-serif" font-size="16">Gen4</text>
  <rect x="80" y="285" width="620" height="30" rx="6" fill="url(#g1)"/>
  <text x="710" y="306" fill="#14181f" font-family="Arial, sans-serif" font-size="15" font-weight="700">~7000 MB/s</text>

  <text x="400" y="390" text-anchor="middle" fill="#14181f" font-family="Arial, sans-serif" font-size="18" font-weight="700">No dia a dia, a diferenca sentida e bem menor</text>
</svg>
