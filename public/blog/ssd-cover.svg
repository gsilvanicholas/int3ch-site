<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#22c9c9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <text x="80" y="90" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="24" font-weight="700">Velocidade de leitura (aprox.)</text>

  <!-- HD bar -->
  <text x="80" y="170" fill="#aab2c0" font-family="Arial, sans-serif" font-size="16">HD mecanico</text>
  <rect x="80" y="185" width="60" height="28" rx="6" fill="#2f7fe0" opacity="0.5"/>
  <text x="150" y="204" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="14">~150 MB/s</text>

  <!-- SATA SSD bar -->
  <text x="80" y="255" fill="#aab2c0" font-family="Arial, sans-serif" font-size="16">SSD SATA</text>
  <rect x="80" y="270" width="280" height="28" rx="6" fill="#2f7fe0"/>
  <text x="370" y="289" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="14">~550 MB/s</text>

  <!-- NVMe bar -->
  <text x="80" y="340" fill="#aab2c0" font-family="Arial, sans-serif" font-size="16">SSD NVMe</text>
  <rect x="80" y="355" width="620" height="28" rx="6" fill="url(#g1)"/>
  <text x="710" y="374" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="14" font-weight="700">3000+ MB/s</text>
</svg>
