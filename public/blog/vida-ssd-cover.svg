<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#22c9c9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <g transform="translate(150,140)">
    <rect x="0" y="0" width="220" height="140" rx="12" fill="#0c0e12" stroke="url(#g1)" stroke-width="3"/>
    <rect x="24" y="24" width="70" height="50" rx="4" fill="none" stroke="#2f7fe0" stroke-width="2"/>
