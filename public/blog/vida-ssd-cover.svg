    <rect x="0" y="14" width="280" height="24" rx="12" fill="#0c0e12" stroke="#21252e" stroke-width="2"/>
    <rect x="4" y="18" width="40" height="16" rx="8" fill="url(#g1)"/>
    <text x="0" y="70" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="14">uso real diario</text>
    <text x="150" y="70" fill="#22c9c9" font-family="Arial, sans-serif" font-size="14" font-weight="700">decadas de vida</text>
