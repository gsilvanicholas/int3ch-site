<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#22c9c9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g2)"/>

  <!-- CPU box -->
  <rect x="90" y="150" width="150" height="150" rx="16" fill="#0c0e12" stroke="url(#g1)" stroke-width="2.5"/>
  <text x="165" y="215" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="30" font-weight="700">CPU</text>
  <text x="165" y="245" text-anchor="middle" fill="#aab2c0" font-family="Arial, sans-serif" font-size="14">processador</text>
  <rect x="105" y="165" width="16" height="16" fill="none" stroke="#2f7fe0" stroke-width="1.5"/>
  <rect x="129" y="165" width="16" height="16" fill="none" stroke="#2f7fe0" stroke-width="1.5"/>
  <rect x="105" y="189" width="16" height="16" fill="none" stroke="#2f7fe0" stroke-width="1.5"/>
  <rect x="129" y="189" width="16" height="16" fill="none" stroke="#2f7fe0" stroke-width="1.5"/>

  <!-- arrow flow -->
  <line x1="250" y1="225" x2="540" y2="225" stroke="url(#g1)" stroke-width="3" stroke-dasharray="10 8"/>
  <polygon points="540,215 560,225 540,235" fill="#22c9c9"/>
  <text x="395" y="205" text-anchor="middle" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="15">instrucoes por segundo</text>

  <!-- GPU box -->
  <rect x="560" y="130" width="190" height="190" rx="16" fill="#0c0e12" stroke="url(#g1)" stroke-width="2.5"/>
  <text x="655" y="215" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="30" font-weight="700">GPU</text>
  <text x="655" y="245" text-anchor="middle" fill="#aab2c0" font-family="Arial, sans-serif" font-size="14">placa de video</text>
  <g stroke="#22c9c9" stroke-width="1.5" fill="none">
    <rect x="580" y="260" width="14" height="14"/>
    <rect x="600" y="260" width="14" height="14"/>
    <rect x="620" y="260" width="14" height="14"/>
    <rect x="640" y="260" width="14" height="14"/>
    <rect x="660" y="260" width="14" height="14"/>
    <rect x="680" y="260" width="14" height="14"/>
    <rect x="700" y="260" width="14" height="14"/>
    <rect x="720" y="260" width="14" height="14"/>
  </g>

  <text x="400" y="380" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Quem trava a fila, o outro fica ocioso</text>
</svg>
